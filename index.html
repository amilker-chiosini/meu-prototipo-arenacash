<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaCash — Indique e ganhe R$ 500</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue-500: #1652f0;
      --blue-700: #0a2a9c;
      --blue-900: #061b63;
      --tint:     #eaf0ff;
      --white:    #ffffff;

      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0b1220;
      background: #0d1330;              /* backdrop neutro atrás dos slides */
      -webkit-font-smoothing: antialiased;
    }

    /* Deck: centraliza os slides. Depois é só adicionar mais .slide aqui dentro. */
    .deck {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    /* Slide em proporção 16:9, escala conforme a tela */
    .slide {
      position: relative;
      width: min(1120px, 100%);
      aspect-ratio: 16 / 9;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px -30px rgba(6, 27, 99, .7);
    }

    /* --- Slide 1: capa da campanha --- */
    .cover {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 4.4vw, 64px);
      color: var(--white);
      background:
        radial-gradient(120% 120% at 85% 15%, var(--blue-500) 0%, var(--blue-700) 48%, var(--blue-900) 100%);
    }

    /* Motivo de "moeda" — dá profundidade sem poluir */
    .cover::after {
      content: "";
      position: absolute;
      right: -14%;
      bottom: -32%;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 32%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.14),
        inset 0 0 0 90px rgba(255,255,255,.05);
      pointer-events: none;
    }

    /* Cabeçalho: marca */
    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      letter-spacing: -.01em;
      font-size: clamp(18px, 1.9vw, 26px);
    }
    .brand__mark {
      display: grid;
      place-items: center;
      width: 1.6em;
      height: 1.6em;
      border-radius: 9px;
      background: var(--white);
      color: var(--blue-700);
      font-size: .62em;
      font-weight: 700;
    }

    /* Bloco central */
    .cover__body {
      position: relative;
      z-index: 1;
      max-width: 60ch;
    }

    .tag {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .28);
      font-size: clamp(12px, 1.15vw, 15px);
      font-weight: 500;
      margin-bottom: clamp(16px, 2.4vw, 28px);
    }

    .headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.025em;
      font-size: clamp(34px, 5.6vw, 76px);
    }
    .headline .reward {
      display: block;
      margin-top: .08em;
      font-weight: 700;
      font-size: 1.7em;
      line-height: .9;
    }
    .headline .reward small {
      font-size: .42em;
      font-weight: 600;
      vertical-align: .62em;
      opacity: .8;
    }

    .subtitle {
      margin-top: clamp(16px, 2.4vw, 26px);
      max-width: 46ch;
      font-size: clamp(15px, 1.55vw, 21px);
      line-height: 1.5;
      color: var(--tint);
    }

    /* Rodapé com o botão */
    .cover__actions {
      position: relative;
      z-index: 1;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 30px;
      border-radius: 14px;
      background: var(--white);
      color: var(--blue-700);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(15px, 1.5vw, 19px);
      text-decoration: none;
      box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .45);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    }
    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, .5);
    }
    .btn:focus-visible {
      outline: 3px solid var(--tint);
      outline-offset: 3px;
    }
    .btn__arrow {
      transition: transform .18s var(--ease);
    }
    .btn:hover .btn__arrow { transform: translateX(3px); }

    @media (prefers-reduced-motion: reduce) {
      .btn, .btn__arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="deck">

    <!-- SLIDE 1 -->
    <section class="slide cover" aria-label="Capa da campanha de indicação">
      <header class="brand">
        <span class="brand__mark">AC</span>
        ArenaCash
      </header>

      <div class="cover__body">
        <span class="tag">Campanha de indicação</span>
        <h1 class="headline">
          Indique um amigo e ganhe
          <span class="reward"><small>R$</small> 50</span>
        </h1>
        <p class="subtitle">
          Convide quem você curte pra abrir conta na ArenaCash.
          A cada indicação que der certo, os R$ 50 caem pra vocês dois.
        </p>
      </div>

      <div class="cover__actions">
        <a class="btn" href="#">
          Saiba mais
          <span class="btn__arrow" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </section>

  </div>
</body>
</html>
